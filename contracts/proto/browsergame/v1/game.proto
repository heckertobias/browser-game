syntax = "proto3";

package browsergame.v1;

option csharp_namespace = "BrowserGame.Contracts.V1";

// Client → Server
message ClientMessage {
  oneof payload {
    Input input = 1;
  }
}

// Gewünschte Laufrichtung für genau einen Server-Tick.
// WASD und Halten-und-Folgen ergeben beide einen Richtungsvektor.
message Input {
  // Fortlaufend pro Verbindung, beginnend bei 1.
  uint32 seq = 1;
  // Länge > 1 wird vom Server auf 1 gekürzt.
  float dir_x = 2;
  float dir_y = 3;
}

// Server → Client
message ServerMessage {
  oneof payload {
    Welcome welcome = 1;
    Snapshot snapshot = 2;
    // Verbindung wird vom Server beendet; danach schließt er den WebSocket.
    Kicked kicked = 3;
  }
}

message Kicked {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    // Derselbe Account hat sich auf einem anderen Gerät ins Spiel angemeldet.
    REASON_SIGNED_IN_ELSEWHERE = 1;
    // Abgemeldet, Passwort zurückgesetzt oder Account gelöscht.
    REASON_SIGNED_OUT = 2;
  }
  Reason reason = 1;
}

message Welcome {
  string player_id = 1;
  string name = 2;
  // Welteinheiten pro Sekunde.
  float speed = 3;
  uint32 tick_rate_hz = 4;
}

message Snapshot {
  uint32 tick = 1;
  // Pro Empfänger: letzte vom Server verarbeitete Eingabe.
  uint32 last_processed_seq = 2;
  repeated PlayerState players = 3;
}

message PlayerState {
  string id = 1;
  string name = 2;
  float x = 3;
  float y = 4;
  // 0xRRGGBB
  uint32 color = 5;
  // Verbindung verloren, Figur wartet noch (Nachlauf) – anders darstellen.
  bool away = 6;
}
