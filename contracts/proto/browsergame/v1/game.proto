syntax = "proto3";

package browsergame.v1;

option csharp_namespace = "BrowserGame.Contracts.V1";

// Client → Server
message ClientMessage {
  oneof payload {
    Input input = 1;
    SendChat send_chat = 2;
    SaveKeyBindings save_key_bindings = 3;
  }
}

// Gewünschte Laufrichtung für genau einen Server-Tick.
// WASD und Halten-und-Folgen ergeben beide einen Richtungsvektor.
message Input {
  // Fortlaufend pro Verbindung, beginnend bei 1.
  uint32 seq = 1;
  // Länge > 1 wird vom Server auf 1 gekürzt.
  float dir_x = 2;
  float dir_y = 3;
}

// Chatnachricht an alle (011). Höchstens 200 Zeichen (UTF-16-Einheiten, wie `maxLength` im Browser);
// der Server trimmt und prüft selbst.
message SendChat {
  string text = 1;
}

// Spieleraktionen, die auf Tasten liegen (002). Neue Aktionen (z. B. Angriffe in 013) kommen hier dazu.
enum Action {
  ACTION_UNSPECIFIED = 0;
  ACTION_MOVE_UP = 1;
  ACTION_MOVE_DOWN = 2;
  ACTION_MOVE_LEFT = 3;
  ACTION_MOVE_RIGHT = 4;
}

message KeyBinding {
  Action action = 1;
  // KeyboardEvent.code, höchstens 2, ohne Escape, Enter, NumpadEnter.
  repeated string codes = 2;
}

// Belegung eines Accounts. Leer = Standard des Clients.
message KeyBindings {
  repeated KeyBinding bindings = 1;
}

// Neue Belegung speichern; leer = Standard wiederherstellen (AK-10). Ungültige Belegungen verwirft der Server still.
message SaveKeyBindings {
  KeyBindings key_bindings = 1;
}

// Server → Client
message ServerMessage {
  oneof payload {
    Welcome welcome = 1;
    Snapshot snapshot = 2;
    // Verbindung wird vom Server beendet; danach schließt er den WebSocket.
    Kicked kicked = 3;
    // Direkt nach Welcome: letzte bis zu 50 Nachrichten der letzten 24 h, älteste zuerst.
    ChatHistory chat_history = 4;
    // Neue Nachricht, an alle Verbindungen in derselben Reihenfolge.
    ChatMessage chat_message = 5;
    // Nur an den Absender: Nachricht nicht angenommen.
    ChatRejected chat_rejected = 6;
  }
}

message Kicked {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    // Derselbe Account hat sich auf einem anderen Gerät ins Spiel angemeldet.
    REASON_SIGNED_IN_ELSEWHERE = 1;
    // Abgemeldet, Passwort zurückgesetzt oder Account gelöscht.
    REASON_SIGNED_OUT = 2;
  }
  Reason reason = 1;
}

message Welcome {
  string player_id = 1;
  string name = 2;
  // Welteinheiten pro Sekunde.
  float speed = 3;
  uint32 tick_rate_hz = 4;
  // Gespeicherte Belegung des Accounts; leer = Standard (AK-9).
  KeyBindings key_bindings = 5;
  // Maximalwerte für HP und Mana (012).
  float max_hp = 6;
  float max_mana = 7;
}

message Snapshot {
  uint32 tick = 1;
  // Pro Empfänger: letzte vom Server verarbeitete Eingabe.
  uint32 last_processed_seq = 2;
  repeated PlayerState players = 3;
  // Pro Empfänger: eigene aktuelle Werte (012).
  float hp = 4;
  float mana = 5;
}

message PlayerState {
  string id = 1;
  string name = 2;
  float x = 3;
  float y = 4;
  // 0xRRGGBB
  uint32 color = 5;
  // Verbindung verloren, Figur wartet noch (Nachlauf) – anders darstellen.
  bool away = 6;
  // Zählt Sprünge der Figur (Respawn, Zurücksetzen); ändert er sich, nicht interpolieren.
  uint32 spawn_seq = 7;
}

message ChatHistory {
  repeated ChatMessage messages = 1;
}

message ChatMessage {
  string sender_name = 1;
  string text = 2;
  // Serverzeit, Unix-Millisekunden; der Client zeigt sie in Ortszeit.
  int64 sent_at_unix_ms = 3;
}

message ChatRejected {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    // Mehr als 5 Nachrichten in 10 Sekunden (AK-13).
    REASON_TOO_FAST = 1;
  }
  Reason reason = 1;
}
