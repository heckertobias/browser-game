name: CI

on:
  push:
    branches: [main]
    # Releases vX.Y.Z und Release Candidates vX.Y.Z-rc.N: signierter Tag (scripts/release.sh)
    tags: ["v*.*.*"]
  pull_request:
  # Nächtlich main bauen und scannen: findet neue Schwachstellen in Basis-Images und prüft Dependabot-Auto-Merges
  # (die keinen push-Workflow auslösen). Veröffentlicht wird nur bei Release- und RC-Tags (ADR 0002, 0009).
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" actionlint
          ./actionlint -color

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: 1.74.0
          lint: true
          format: true
          # breaking: Standard (nur bei PRs gegen main)
          push: false
          archive: false
          pr_comment: false

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: server/global.json
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build

  # Dieselben Tests gegen PostgreSQL (ADR 0004).
  server-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      TEST_DB_PROVIDER: Postgres
      TEST_POSTGRES: Host=localhost;Port=5432;Username=test;Password=test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: server/global.json
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build
      - name: Migrationen passen zum Modell (beide Provider, beide Kontexte)
        run: |
          dotnet tool restore
          for context in SqliteGameDbContext PostgresGameDbContext SqliteAdminDbContext PostgresAdminDbContext; do
            dotnet ef migrations has-pending-model-changes --no-build --configuration Release \
              --project BrowserGame.Data --startup-project BrowserGame.Data --context "$context"
          done

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Zwei Images aus einem Dockerfile (ADR 0006): Spiel und Admin.
  docker:
    needs: [contracts, server, server-postgres, client]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: game
            image: ghcr.io/heckertobias/browser-game
          - target: admin
            image: ghcr.io/heckertobias/browser-game-admin
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      IMAGE: ${{ matrix.image }}
      # Veröffentlichen nur bei Release- und RC-Tags (scripts/release.sh); sonst nur bauen und scannen.
      PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # v0.3.0 → :0.3.0 + :latest; v0.3.0-rc.1 → nur :0.3.0-rc.1 (kein :latest)
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      # Version im Client-Bundle (007 AK-15): Release-/RC-Tag, sonst kurzer Commit-Hash (bei PRs der Head-Commit,
      # nicht der flüchtige Merge-Commit).
      - name: Version fürs Client-Bundle
        id: version
        env:
          META_VERSION: ${{ steps.meta.outputs.version }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$PUBLISH" == "true" ]]; then
            v="$META_VERSION"
            # Format wie scripts/release.sh
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo "Unerwartete Version: '$v'" >&2; exit 1; }
          else
            v="${COMMIT_SHA::7}"
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
      # Pro Architektur lokal bauen und scannen (Basis-Image-Pakete unterscheiden sich je Architektur).
      - name: Build amd64 (zum Scannen)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          build-args: APP_VERSION=${{ steps.version.outputs.value }}
          load: true
          tags: browser-game-${{ matrix.target }}:scan-amd64
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Trivy-Scan amd64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: browser-game-${{ matrix.target }}:scan-amd64
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Build arm64 (zum Scannen)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/arm64
          build-args: APP_VERSION=${{ steps.version.outputs.value }}
          load: true
          tags: browser-game-${{ matrix.target }}:scan-arm64
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Trivy-Scan arm64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: browser-game-${{ matrix.target }}:scan-arm64
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: env.PUBLISH == 'true'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: APP_VERSION=${{ steps.version.outputs.value }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
      - if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # volle Historie + Tags für die Notes seit dem letzten Release
          persist-credentials: false
      - name: GitHub Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          flags=()
          # RC (Tag mit „-“) → Vorabversion
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"

  # Einziger Required Check im Ruleset. Neue Jobs nur in `needs` eintragen.
  ci-ok:
    if: always()
    needs: [lint, contracts, server, server-postgres, client, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Alle Jobs erfolgreich?
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Ergebnisse: ${RESULTS}"
          for r in ${RESULTS}; do
            [[ "$r" == "success" || "$r" == "skipped" ]] || exit 1
          done
