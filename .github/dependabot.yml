# Version-Updates: wöchentlich, Minor/Patch gruppiert, 7 Tage Cooldown (ADR 0002). Sicherheitsupdates kommen sofort.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /server
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint unterstützt TypeScript 7 noch nicht (Peer-Range <6.1). Wieder freigeben, sobald es das tut.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Build-Stage bleibt auf Node-LTS (gerade Majors); den Wechsel auf die nächste LTS machen wir bewusst von Hand.
      - dependency-name: node
        update-types: [version-update:semver-major]

  # Hält das SDK in global.json aktuell – der einzige Weg zu einem neuen SDK (global.json: rollForward "patch").
  - package-ecosystem: dotnet-sdk
    directory: /server
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
