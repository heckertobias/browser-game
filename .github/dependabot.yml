# Version-Updates: wöchentlich, Minor/Patch gruppiert, 7 Tage Cooldown (ADR 0002). Sicherheitsupdates kommen sofort.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /server
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Nur .NET-LTS (gerade Majors); den Wechsel auf die nächste LTS machen wir bewusst von Hand.
      - dependency-name: "Microsoft.*"
        update-types: [version-update:semver-major]
      - dependency-name: "System.*"
        update-types: [version-update:semver-major]
      - dependency-name: "Npgsql.EntityFrameworkCore.PostgreSQL"
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Build-Stage bleibt auf Node-LTS (gerade Majors); den Wechsel auf die nächste LTS machen wir bewusst von Hand.
      - dependency-name: node
        update-types: [version-update:semver-major]
      # Ebenso .NET: nur LTS, Wechsel von Hand.
      - dependency-name: dotnet/sdk
        update-types: [version-update:semver-major]
      - dependency-name: dotnet/aspnet
        update-types: [version-update:semver-major]

  # Hält das SDK in global.json aktuell – der einzige Weg zu einem neuen SDK (global.json: rollForward "patch").
  - package-ecosystem: dotnet-sdk
    directory: /server
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Nur .NET-LTS; den Wechsel auf die nächste LTS machen wir bewusst von Hand.
      - dependency-name: "*"
        update-types: [version-update:semver-major]
