# Vorlage für deploy/compose.yaml – NICHT direkt deployen.
# scripts/release.sh erzeugt daraus compose.yaml, erst nachdem die Images der Version veröffentlicht sind
# (__VERSION__ wird ersetzt). Strukturänderungen hier gehen so nie live, bevor die passenden Images existieren.
#
# Betrieb hinter nginx-proxy (externes Docker-Netz "proxy"), z. B. per Arcane Git Sync.
# Kein Dienst veröffentlicht einen Port: Erreichbar sind beide nur über den Proxy (Forwarded-Header werden vertraut).
# In der .env des Projekts (keine internen Namen im Repo):
#   VIRTUAL_HOST=browsergame.example.internal          # Spiel
#   ADMIN_VIRTUAL_HOST=admin-browsergame.example.internal  # Admin – nur intern erreichbar machen (004 AK-6)
services:
  browsergame:
    image: ghcr.io/heckertobias/browser-game:__VERSION__
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    volumes:
      - data:/data
    environment:
      TZ: Europe/Berlin
      VIRTUAL_HOST: ${VIRTUAL_HOST:?VIRTUAL_HOST in der .env setzen}
      VIRTUAL_PORT: 8080
      App__PublicUrl: https://${VIRTUAL_HOST}
      Passkeys__ServerDomain: ${VIRTUAL_HOST}
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      Database__Provider: Sqlite
      Database__BackupPath: /data/backup/game.db

  browsergame-admin:
    image: ghcr.io/heckertobias/browser-game-admin:__VERSION__
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    volumes:
      - data:/data
    environment:
      TZ: Europe/Berlin
      VIRTUAL_HOST: ${ADMIN_VIRTUAL_HOST:?ADMIN_VIRTUAL_HOST in der .env setzen}
      VIRTUAL_PORT: 8080
      App__PublicUrl: https://${ADMIN_VIRTUAL_HOST}
      Passkeys__ServerDomain: ${ADMIN_VIRTUAL_HOST}
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      Database__Provider: Sqlite

volumes:
  # Gemeinsame SQLite-Datenbank von Spiel und Admin (ADR 0006). Ins Backup aufnehmen.
  data:

networks:
  proxy:
    name: proxy
    external: true
