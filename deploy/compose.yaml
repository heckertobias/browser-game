# Beispiel: Betrieb hinter nginx-proxy (externes Docker-Netz "proxy"). Ausrollen liegt außerhalb des Repos (ADR 0012).
# Kein Dienst veröffentlicht einen Port: Erreichbar sind beide nur über den Proxy. Das ist Pflicht, denn
# ASPNETCORE_FORWARDEDHEADERS_ENABLED glaubt den X-Forwarded-*-Headern jedes Absenders.
# Alle Variablen: README, Abschnitt „Konfiguration“. Mail (SMTP) wird im Admin unter „SMTP“ eingerichtet, nicht hier.
# In der .env des Projekts (keine internen Namen im Repo):
#   GAME_VERSION=0.3.0                                  # auszurollende Version
#   VIRTUAL_HOST=browsergame.example.internal           # Spiel
#   ADMIN_VIRTUAL_HOST=admin-browsergame.example.internal  # Admin – nur intern erreichbar machen (004 AK-6)
services:
  browsergame:
    image: ghcr.io/heckertobias/browser-game:${GAME_VERSION:?GAME_VERSION in der .env setzen}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    volumes:
      - data:/data
    environment:
      TZ: Europe/Berlin
      VIRTUAL_HOST: ${VIRTUAL_HOST:?VIRTUAL_HOST in der .env setzen}
      VIRTUAL_PORT: 8080
      App__PublicUrl: https://${VIRTUAL_HOST}
      Passkeys__ServerDomain: ${VIRTUAL_HOST}
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      Database__Provider: Sqlite
      ConnectionStrings__Game: Data Source=/data/game.db
      Database__BackupPath: /data/backup/game.db

  browsergame-admin:
    image: ghcr.io/heckertobias/browser-game-admin:${GAME_VERSION:?GAME_VERSION in der .env setzen}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    volumes:
      - data:/data
    environment:
      TZ: Europe/Berlin
      VIRTUAL_HOST: ${ADMIN_VIRTUAL_HOST:?ADMIN_VIRTUAL_HOST in der .env setzen}
      VIRTUAL_PORT: 8080
      App__PublicUrl: https://${ADMIN_VIRTUAL_HOST}
      Passkeys__ServerDomain: ${ADMIN_VIRTUAL_HOST}
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      Database__Provider: Sqlite
      ConnectionStrings__Game: Data Source=/data/game.db

volumes:
  # Gemeinsame SQLite-Datenbank von Spiel und Admin (ADR 0006), samt Data-Protection-Schlüsseln.
  # Ins Backup gehört /data/backup/game.db (konsistente Kopie des Spiels, täglich 03:50 Ortszeit).
  data:

networks:
  proxy:
    name: proxy
    external: true
